# SAM deployment configuration
# Stack in us-east-1 (Lex V2 supported)
# Bedrock in ap-south-1 (Claude Haiku 4.5 working)

version = 0.1

[default.deploy.parameters]
stack_name = "CloudAge"
region = "us-east-1"
confirm_changeset = true
capabilities = "CAPABILITY_NAMED_IAM"
s3_prefix = "CloudAge"
resolve_s3 = true
parameter_overrides = "Stage=\"staging\" BedrockModelId=\"us.amazon.nova-pro-v1:0\" BedrockRegion=\"us-east-1\" SystemPrompt=\"You are a helpful corporate research assistant. Provide fact-based descriptions of corporations using reliable sources. Be concise and accurate.\" PollyVoiceId=\"Danielle\" ReservedConcurrency=\"-1\""
image_repositories = []

[default.build.parameters]
cached = true
parallel = true

[default.global.parameters]
region = "us-east-1"
